# Attaches the companion's .app to its GitHub release, beside AL-Go's zip.
#
# AL-Go's Create release attaches the build as a zip (AL-Go builds can hold
# several apps; ours holds one). Business Central installs the .app itself, so
# this unzips it and attaches it twice:
#   - under its own name, e.g. ERR403_Dynamic.Assist.Companion_2026.11.15.5.app
#   - as DynamicAssistCompanion.app, so this link always downloads the latest:
#     https://github.com/garethcheyne/Dynamic-Assist_BusinessCentralAddon/releases/latest/download/DynamicAssistCompanion.app
#
# It runs when Create release finishes. (A release made with the workflow's
# own token doesn't trigger "release" workflows, so it can't wait for that.)
# Run it by hand with a tag to attach the .app to an earlier release.
#
# Not an AL-Go system file: Update AL-Go System Files leaves it alone.
name: Attach the .app to the release

on:
  workflow_run:
    workflows: [" Create release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (blank = the latest release)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: attach-app
  cancel-in-progress: false

jobs:
  attach:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_INPUT: ${{ github.event.inputs.tag }}
    steps:
      - name: Find the release
        id: release
        run: |
          set -euo pipefail
          if [ -n "${TAG_INPUT:-}" ]; then
            tag="$TAG_INPUT"
          else
            # The newest release, which Create release has just made
            tag=$(gh release view --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag"

      - name: Unzip the app
        id: app
        run: |
          set -euo pipefail
          mkdir -p zip app
          gh release download "${{ steps.release.outputs.tag }}" --pattern "*Apps*.zip" --dir zip
          unzip -o -q zip/*.zip -d app
          apps=$(find app -name "*.app" | wc -l)
          if [ "$apps" -ne 1 ]; then
            echo "::error::Expected one .app in the release's zip, found $apps"
            exit 1
          fi
          file=$(find app -name "*.app")
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Found $(basename "$file")"

      - name: Attach it to the release
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          file="${{ steps.app.outputs.file }}"
          cp "$file" DynamicAssistCompanion.app
          # --clobber: running it again replaces them
          gh release upload "$tag" "$file" DynamicAssistCompanion.app --clobber
          gh release view "$tag" --json assets -q '.assets[].name'
